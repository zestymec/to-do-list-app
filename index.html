<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="todo-app">
            <div class="heading">
                <h1>TO-DO LIST APP</h1><img class="to-do-icon" src="images/to-do-icon.png">

            </div>
            <div class="input-row">
                <input type="text" id="input-box" class="input-box" placeholder="Add your task">
                <button class="add-btn">Add</button>
            </div>
            <ul class="list-container">
                <!-- <li class="checked"></li>
                <li>task 2</li>
                <li>task 3</li> -->
            </ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
